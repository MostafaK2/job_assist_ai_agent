services:
  db:
    image: postgres:16
    container_name: agent-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    image: job-assist-backend
    container_name: agent-backend
    env_file: .env
    environment:
      # Inside Docker the database is "db", not localhost. Overrides .env.
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@db:5432/${POSTGRES_DB:-agent}
      HEADLESS: "true"        # for Playwright later; harmless now
    volumes:
      - ./src/backend/data:/code/src/backend/data
    shm_size: 1gb             # for Chromium later; harmless now
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ingest:
    image: job-assist-backend
    pull_policy: never
    container_name: agent-ingest
    env_file: .env
    environment:
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@db:5432/${POSTGRES_DB:-agent}
    volumes:
      - ./src/backend/data:/code/src/backend/data   # greenhouse_companies.json
    entrypoint: ["python", "-m", "app.ingest.sync_greenhouse"]   # skip migrations + uvicorn
    healthcheck:
      disable: true       # image healthcheck pings :8000, which ingest doesn't serve
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: "no"
  
  frontend:
    build:
      context: ./src/frontend
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-false}
    container_name: agent-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: agent-caddy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      # Local: 127.0.0.1 = only your machine. Server: set BIND_IP=0.0.0.0 in .env.
      - "${BIND_IP:-127.0.0.1}:80:80"
      - "${BIND_IP:-127.0.0.1}:443:443"
      - "${BIND_IP:-127.0.0.1}:443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates live here; keep them across restarts
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config: